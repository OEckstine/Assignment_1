<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 3</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="catbackground">
      <img src="Assets/c1.png" alt="catpattern" class="topleft" />
      <img src="Assets/c2.png" alt="catpattern" class="bottomleft" />
      <img src="Assets/c3.png" alt="catpattern" class="middle" />
      <img src="Assets/c4.png" alt="catpattern" class="topright" />
      <img src="Assets/c5.png" alt="catpattern" class="bottomright" />
    </div>
    <div class="notecards">
      <img src="Assets/note1.png" alt="Note 1" class="topleft" />
      <img src="Assets/note2.png" alt="Note 2" class="bottomleft" />
      <img src="Assets/note3.png" alt="Note 3" class="bottommiddle" />
      <img src="Assets/note2.png" alt="Note 4" class="topmiddle" />
      <img src="Assets/note3.png" alt="Note 5" class="topright" />
      <img src="Assets/note1.png" alt="Note 6" class="bottomright" />
    </div>
    <div class="cats">
      <img src="Assets/meow1.png" alt="cat1" class="cat1" />
      <img src="Assets/meow2.png" alt="cat2" class="cat2" />
      <img src="Assets/meow3.png" alt="cat3" class="cat3" />
      <img src="Assets/meow4.png" alt="cat4" class="cat4" />
      <img src="Assets/meow5.png" alt="cat5" class="cat5" />
      <img src="Assets/meow6.png" alt="cat6" class="cat6" />
    </div>
    <div class="stars">
      <img src="Assets/star1.png" alt="star1" class="star-yellow" />
      <img src="Assets/star2.png" alt="star2" class="star-blue" />
      <img src="Assets/star3.png" alt="star3" class="star-gold" />
      <img src="Assets/star4.png" alt="star4" class="star-magenta" />
      <img src="Assets/star5.png" alt="star5" class="star-swirl" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
